# =========================
# Kernel Builder Config
# =========================
# By Karamdev1
# =========================

# For toolchains you can set the folders however you want but make sure to add them to paths
# for single folder just "$FOLDERNAME", but for multiple lets say folder1 and folder2 "$folder1:$folder2", ':' is the separator!

# To identify optional values check for 'optional' comment after it
# For optional values set value "" if you dont want to set anything

# --- Architecture --- Required
ARCH=arm64

# --- Toolchain --- Toolchain Folders here
TD="$HOME/toolchains/clang-22.0.2-r596125/bin"
ARM64="$HOME/toolchains/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
ARM32="$HOME/toolchains/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin"

# --- Paths ---
# PATHS is the paths to export during setup
PATHS="$TD:$ARM64:$ARM32"
CC=clang
CLANG_TRIPLE=aarch64-linux-gnu- # Optional
CROSS_COMPILE_TOGGLE=y # y for enabled, n for disabled
CROSS_COMPILE=aarch64-linux-android- # Required if CROSS_COMPILE_TOGGLE is enabled

# Only for arm64 kernels that require arm32 toolchain
CROSS_COMPILE_ARM32=arm-linux-androideabi- # Required if CROSS_COMPILE_TOGGLE is enabled

# --- Build Flags ---
KCFLAGS="" # Optional
KCPPFLAGS="" # Optional
ANDROID_MAJOR_VERSION="" # Optional
SECTION_MISMATCH=n # y for warn only, e for normal mismatch, n for disabled
ENV="" # Optional

# --- Build output ---
OUT_DIR=out
MODULES_OUT_DIR=out_modules
